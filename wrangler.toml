name = "choutuan"
compatibility_date = "2026-10-01"
main = "src/worker.js"

[assets]
directory = "./public"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "choutuan-db"
database_id = "f149b6c1-c0d2-4606-9168-4f8861cc6d92"
migrations_dir = "db/migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "10d94612b4134a66bea77beb5b8e8305"
preview_id = "571fc218fcc34e41ada6c02ab0147e07"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "choutuan-images"
preview_bucket_name = "choutuan-images-preview"

[vars]
APP_NAME = "choutuan 丑团"

HOOK_PROD = "d78e5118e06fcba76c9dddf7aead5783"
HOOK_TEST = "15de7e755fbc68c5a799e2c3b4374d65"

[[routes]]
pattern = "choutuan.2453452242.shop"
custom_domain = true


[env.staging]
name = "choutuan-staging"
workers_dev = true
routes = []

[env.staging.vars]
APP_NAME = "choutuan 丑团 (staging)"
HOOK_PROD = "d78e5118e06fcba76c9dddf7aead5783"
HOOK_TEST = "15de7e755fbc68c5a799e2c3b4374d65"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "choutuan-db-staging"
database_id = "719183d1-9295-470f-8321-1ee21b9bfd5a"
migrations_dir = "db/migrations"

[[env.staging.kv_namespaces]]
binding = "CACHE"
id = "519ea3e987ac4682a21385a450facfbb"

[[env.staging.r2_buckets]]
binding = "IMAGES"
bucket_name = "choutuan-images-staging"
