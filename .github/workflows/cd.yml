name: cd
on:
  push:
    branches: [production]
  workflow_dispatch:
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 线上D1迁移 (先迁库再发码)
        run: npx wrangler d1 migrations apply choutuan-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 发版 Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: 线上冒烟 (health + 列表 + 分类, 带全球传播重试)
        run: |
          sleep 15
          curl -sf --retry 5 --retry-delay 5 --retry-all-errors https://choutuan.telesearch.workers.dev/api/health | tee /tmp/health.json | grep -q '"ok":true'
          curl -sf --retry 5 --retry-delay 5 --retry-all-errors --get --data-urlencode "category=美食" https://choutuan.telesearch.workers.dev/api/shops | tee /tmp/shops.json | grep -q '"total"'
          curl -sf --retry 5 --retry-delay 5 --retry-all-errors https://choutuan.telesearch.workers.dev/api/categories | tee /tmp/cats.json | grep -q '"全部"'
          echo "smoke-ok"
