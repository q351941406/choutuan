name: preview-deploy
on:
  push:
    branches: [preview]
concurrency:
  group: preview-deploy
  cancel-in-progress: false
jobs:
  staging-release:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 验证 (main 永远绿的前置条件)
        run: npm run verify
      - name: 部署 staging (预发布)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: staging 冒烟
        run: |
          sleep 10
          curl -sf --retry 5 --retry-delay 3 https://choutuan-staging.telesearch.workers.dev/api/health | grep -q '"ok":true'
          curl -sf --retry 5 --retry-delay 3 https://choutuan-staging.telesearch.workers.dev/api/categories | grep -q '"全部"'
          echo "staging-release-ok"
