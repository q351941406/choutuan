name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 语法自检
        run: npm run check
      - name: seed一致性 (shops.js -> seed.sql)
        run: npm run seed:gen && git diff --exit-code db/seed.sql
      - name: D1本地建表+灌库自检
        run: npm run db:setup:local && npx wrangler d1 execute choutuan-db --local --command="SELECT count(*) as shops FROM shops;"
      - name: Node内存API冒烟 (3002端口, 起完即停)
        run: |
          PORT=3002 node src/node-server.js & echo $! > /tmp/srv.pid
          sleep 3
          curl -sf http://localhost:3002/api/health | grep -q '"ok":true'
          curl -sf "http://localhost:3002/api/shops?category=美食" | grep -q '"total"'
          curl -sf http://localhost:3002/api/categories | grep -q '"全部"'
          kill "$(cat /tmp/srv.pid)"
      - name: CF部署预演
        run: npx wrangler deploy --dry-run
