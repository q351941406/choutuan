name: preview
on:
  pull_request:
    branches: [main, production]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  staging-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: 验证
        run: npm run verify
      - name: 部署 staging 预览
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env staging
      - name: 冒烟 staging
        run: |
          curl -sf --retry 5 --retry-delay 3 https://choutuan-staging.telesearch.workers.dev/api/health | grep -q '"ok":true'
          echo "staging-smoke-ok"
      - name: 评论预览链接
        uses: actions/github-script@v7
        with:
          script: |
            const url = 'https://choutuan-staging.telesearch.workers.dev';
            const marker = '<!-- choutuan-staging-preview -->';
            const body = `${marker}\n**Staging 预览已更新**\n- URL: ${url}\n- commit: ${context.payload.pull_request.head.sha}\n- API: ${url}/api/health`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
