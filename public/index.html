<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>丑团 choutuan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fff;--bg2:#F2F2F7;--page:#E9E9EE;--text:#000;--hint:#8E8E93;--link:#2481CC;--btn:#2481CC;--btnTx:#fff;--line:#E5E5EA}
@media (prefers-color-scheme:dark){:root{--bg:#17212B;--bg2:#0E1621;--page:#0E1621;--text:#fff;--hint:#7d8690;--line:#2b3a49}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;background:var(--page);color:var(--text)}
.phone{width:100%;max-width:520px;margin:0 auto;background:var(--bg);min-height:100vh;padding-bottom:24px}
.nav{position:sticky;top:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);padding:14px 16px 8px;border-bottom:.5px solid var(--line);z-index:5}
.nav-top{display:flex;align-items:center;justify-content:space-between}
.nav-title{font-size:17px;font-weight:600}.nav-loc{font-size:13px;color:var(--link)}
#hello{font-size:13px;color:var(--hint);margin-top:4px}
.search{margin:10px 0 6px;background:var(--bg2);border-radius:10px;padding:8px 10px;display:flex;gap:6px}
.search input{border:0;outline:0;background:transparent;flex:1;font-size:15px;color:var(--text)}.citybtn{flex-shrink:0;border:0;background:transparent;font-size:15px;color:var(--link);padding:2px 4px}.gobtn{flex-shrink:0;border:0;background:var(--btn);color:var(--btnTx);font-size:14px;border-radius:8px;padding:6px 12px}
.chips{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.chip{font-size:14px;padding:7px 13px;border-radius:16px;background:var(--bg2);white-space:nowrap;border:0;color:var(--text)}
.chip.on{background:var(--btn);color:var(--btnTx)}
.group-title{font-size:13px;color:var(--hint);padding:16px 32px 6px}
.group{margin:0 16px;background:var(--bg);border-radius:10px;overflow:hidden;border:.5px solid var(--line)}
.cell{display:flex;gap:12px;padding:11px 14px;align-items:center;background:var(--bg);width:100%;border:0;text-align:left;color:var(--text);font-size:inherit}
.cell+.cell{border-top:.5px solid var(--line)}
.avatar{width:48px;height:48px;border-radius:10px;background:#EAF3FB;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.meta{flex:1;min-width:0}.meta b{font-size:16px;font-weight:400;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--hint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#C7C7CC;font-size:18px}
.hint{font-size:13px;color:var(--hint);padding:10px 32px;line-height:1.6}
.tab{position:fixed;bottom:0;width:100%;max-width:520px;left:50%;transform:translateX(-50%);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px);border-top:.5px solid var(--line);display:flex}
.tab div{flex:1;text-align:center;padding:7px 0 18px;font-size:10px;color:var(--hint)}
.tab .on{color:var(--link)}
#detail{display:none}.back{color:var(--link);font-size:16px;border:0;background:none}
.hero{padding:18px 16px 6px;display:flex;gap:14px;align-items:center}
.big{width:64px;height:64px;border-radius:14px;background:#EAF3FB;display:flex;align-items:center;justify-content:center;font-size:36px}
.t{font-size:13px;color:var(--hint);padding:16px 32px 6px}
.mainbtn{margin:16px;background:var(--btn);color:var(--btnTx);text-align:center;border-radius:10px;padding:13px;font-size:16px;border:0;width:calc(100% - 32px)}
.ghost{margin:0 16px 10px;width:calc(100% - 32px);border:.5px solid var(--line);text-align:center;border-radius:10px;padding:11px;font-size:15px;color:var(--link);background:var(--bg)}
.loading,.empty{padding:30px;text-align:center;color:var(--hint);font-size:14px}.sk{padding:11px 14px;display:flex;gap:12px;align-items:center}.sk i{display:block;background:var(--bg2);border-radius:8px;animation:pl 1.2s infinite}.sk .a{width:48px;height:48px}.sk .b{flex:1;height:14px}@keyframes pl{50%{opacity:.45}}.star{color:#F59E0B;font-style:normal}.tagpill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg2);color:var(--hint);margin:0 6px 6px 0}.intg #detail>.nav{display:none!important}.mapdim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:98;transition:opacity .18s ease}.mappanel{position:fixed;left:0;right:0;bottom:0;z-index:99;background:var(--bg);border-radius:14px 14px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;animation:sheetUp .22s ease}.maprow{display:flex;align-items:center;width:100%;border:0;background:var(--bg);color:var(--text);font-size:16px;padding:13px 4px;text-align:left}.maprow+.maprow{border-top:.5px solid var(--line)}.mapcancel{width:100%;border:0;background:var(--bg2);color:var(--text);font-size:16px;border-radius:10px;padding:12px;margin-top:8px}@keyframes sheetUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}@keyframes sheetDown{to{transform:translateY(60px);opacity:0}}.mappanel.closing{animation:sheetDown .18s ease}@media (prefers-reduced-motion:reduce){.mappanel{animation:none}}.intg #home>.nav{padding-top:6px}.intg #home .nav-top{display:none}#detail.anim{animation:pushIn .26s ease}@keyframes pushIn{from{transform:translateX(60px);opacity:.4}to{transform:none;opacity:1}}#detail.out{animation:popOut .2s ease}@keyframes popOut{to{transform:translateX(60px);opacity:0}}@media (prefers-reduced-motion:reduce){#detail.anim,#detail.out{animation:none}}
</style>
</head>
<body>
<div class="phone">
<div id="home">
<div class="nav"><div class="nav-top"><div class="nav-loc">‹ <span id="cityName">深圳</span></div><div class="nav-title">丑团 choutuan</div><div class="nav-loc">···</div></div><div id="hello">同城好店 · 仅展示</div><div class="search"><button class="citybtn" id="cityBtn">深圳</button><input id="q" placeholder="搜索店名 / 地址"/><button class="gobtn" id="goBtn">搜索</button></div></div>
<div class="chips" id="chips"></div>
<div class="group-title" id="count">加载中…</div>
<div class="group" id="list"><div class="sk"><i class="a"></i><i class="b"></i></div>'.repeat(3)</div>
<div class="hint">Telegram 原生风 · 颜色跟随深色/浅色主题 · 点任意店进详情 · 洗浴按摩 · 商K · 仅展示 20 家</div>
</div>
<div id="detail">
<div class="nav" style="display:flex;align-items:center;gap:8px"><button class="back" id="backBtn">‹ 返回</button><div class="nav-title" style="flex:1;text-align:center;margin-right:44px">店铺详情</div></div>
<div id="dBody"></div><div id="mapSheet" style="display:none"><div class="mapdim" id="mapDim"></div><div class="mappanel"><div style="text-align:center;font-size:13px;color:var(--hint);padding:6px 0 2px">去这里</div><div id="mapList"></div><button class="mapcancel" id="mapCancel">取消</button></div></div>
<button class="mainbtn" id="navBtn">导航去这里</button>
<a class="ghost" id="callBtn" style="display:block;text-decoration:none" href="#">拨打电话</a>
<button class="ghost" id="shareBtn">分享给朋友</button>
</div>
</div>
<script>
const tg = window.Telegram?.WebApp; let cur=null;
var inTG=false;try{inTG=!!(tg&&tg.initData);}catch(_e){}try{if(inTG){document.body.classList.add('intg');tg.ready();tg.expand();tg.setHeaderColor('bg_color');tg.setBackgroundColor('bg_color');tg.disableVerticalSwipes();}else{tg.ready();tg.expand();}}catch(e){}
function applyTheme(){try{const p=tg?.themeParams||{};if(p.bg_color)document.documentElement.style.setProperty('--bg',p.bg_color);if(p.secondary_bg_color)document.documentElement.style.setProperty('--bg2',p.secondary_bg_color);if(p.text_color)document.documentElement.style.setProperty('--text',p.text_color);if(p.hint_color)document.documentElement.style.setProperty('--hint',p.hint_color);if(p.link_color){document.documentElement.style.setProperty('--link',p.link_color);document.documentElement.style.setProperty('--btn',p.button_color||p.link_color);}if(p.button_text_color)document.documentElement.style.setProperty('--btnTx',p.button_text_color);}catch(e){}}
applyTheme();try{tg?.onEvent('themeChanged',applyTheme);}catch(e){}
try{const u=tg?.initDataUnsafe?.user;if(u)document.getElementById('hello').textContent='你好, '+(u.first_name||'丑团食客')+' · 同城好店 · 仅展示';}catch(e){}
let cats=['全部'],cat='全部',timer=null;var city="深圳";var cityManual=null;var CITIES=["深圳","成都"];let myPos=null;function havKm(a,b,c,d){var R=6371,t=Math.PI/180;var s1=Math.sin((c-a)*t/2),s2=Math.sin((d-b)*t/2);var h=s1*s1+Math.cos(a*t)*Math.cos(c*t)*s2*s2;return 2*R*Math.asin(Math.sqrt(h));}function fmtD(km){return km<1?Math.round(km*1000)+'m':km.toFixed(1)+'km';}function locate(ok){function done(p){myPos=p;if(ok){try{ok();}catch(e){}}}function fb(){var g=null;try{g=navigator.geolocation;}catch(e){}if(g){try{g.getCurrentPosition(function(p){done({lat:p.coords.latitude,lng:p.coords.longitude});},function(){done(null);},{timeout:8000});}catch(e){done(null);}}else{done(null);}}var useLM=false;try{var L=tg.LocationManager;if(L){if(tg.isVersionAtLeast('8.0')){useLM=true;try{L.init(function(){var done2=false;try{L.getLocation(function(loc){done2=true;if(loc){if(loc.latitude){done({lat:loc.latitude,lng:loc.longitude});}else{fb();}}else{fb();}});}catch(e){if(!done2){fb();}}});}catch(e){useLM=false;}}}}catch(e){}if(!useLM){fb();}}function renderCities(){var cb=document.getElementById('cityBtn');if(cb){cb.textContent=city+' '+String.fromCharCode(9662);cb.onclick=function(){city=(city===CITIES[0]?CITIES[1]:CITIES[0]);cityManual=city;try{localStorage.setItem('ct_city',city);}catch(e){}try{tg.HapticFeedback.selectionChanged();}catch(e2){}renderCities();loadCats().then(loadList);};}var gb=document.getElementById('goBtn');if(gb){gb.onclick=function(){try{tg.HapticFeedback.selectionChanged();}catch(e){}loadList();};}var cn=document.getElementById('cityName');if(cn){cn.textContent=city;}}function guessCity(cb){function done(){try{cb&&cb();}catch(e){}}if(cityManual){done();return;}if(!myPos){done();return;}var u="https://api.bigdatacloud.net/data/reverse-geocode-client?latitude="+myPos.lat+"&longitude="+myPos.lng+"&localityLanguage=zh";var to=setTimeout(function(){done();},6000);fetch(u).then(function(r){return r.json();}).then(function(j){clearTimeout(to);var s=JSON.stringify(j||{});if(s.indexOf("深圳")>=0){city="深圳";}else{if(s.indexOf("成都")>=0){city="成都";}}done();}).catch(function(){clearTimeout(to);done();});}
const ICO={'全部':'✨','洗浴按摩':'🧖','商K':'🎤'};
function fmtS(n){return n>=1000?(n/1000).toFixed(1)+'k':''+n;}
async function loadCats(){try{const r=await fetch('/api/categories?city='+encodeURIComponent(city)).then(x=>x.json());if(r.ok)cats=r.data;}catch(e){}renderChips();}
function renderChips(){document.getElementById('chips').innerHTML=cats.map(c=>'<button class="chip'+(c===cat?' on':'')+'" data-c="'+c+'">'+(ICO[c]||'')+c+'</button>').join('');document.getElementById('chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;try{tg?.HapticFeedback?.selectionChanged();}catch(e){}renderChips();loadList();});}
async function loadList(){const q=document.getElementById('q').value.trim();const box=document.getElementById('list');box.innerHTML='<div class="sk"><i class="a"></i><i class="b"></i></div>'.repeat(3);try{const r=await fetch('/api/shops?category='+encodeURIComponent(cat)+'&q='+encodeURIComponent(q)+'&city='+encodeURIComponent(city)+(myPos?'&lat='+myPos.lat+'&lng='+myPos.lng:'')).then(x=>x.json());document.getElementById('count').textContent='附近 · '+r.total+' 家'+(cat!=='全部'?' · '+cat:'')+(myPos?' ·已按距离':'');if(!r.data.length){box.innerHTML='<div class="empty">没找到，换个关键词试试</div>';return;}box.innerHTML=(function(){var arr=r.data||[];if(myPos){for(var i=0;i<arr.length;i++){var s=arr[i];if(s.lat){if(s.lng){s._d=havKm(myPos.lat,myPos.lng,s.lat,s.lng);}}}}arr.sort(function(a,b){var x=a._d==null?1e9:a._d;var y=b._d==null?1e9:b._d;return x-y;});;return arr;})().map(s=>'<button class="cell" data-id="'+s.id+'"><div class="avatar">'+s.emoji+'</div><div class="meta"><b>'+s.name+'</b><div class="sub"><i class="star">★</i>'+s.rating+' · '+(s._d==null?s.dist:fmtD(s._d))+' · 人均¥'+s.per+'</div></div><div class="chev">›</div></button>').join('');document.querySelectorAll('.cell').forEach(b=>b.onclick=()=>openDetail(b.dataset.id));}catch(e){box.innerHTML='<button class="cell" style="justify-content:center;color:var(--hint)" onclick="loadList()">网络开小差了，点我重试</button>';}}
async function openDetail(id){try{tg?.HapticFeedback?.impactOccurred('light');}catch(e){}try{const r=await fetch('/api/shops/'+id).then(x=>x.json());cur=r.data;document.getElementById('home').style.display='none';document.getElementById('detail').style.display='block';var dd=document.getElementById('detail');dd.classList.remove('out');void dd.offsetWidth;dd.classList.add('anim');document.getElementById('dBody').innerHTML='<div class="hero"><div class="big">'+cur.emoji+'</div><div><h2 style="margin:0;font-size:20px">'+cur.name+'</h2><div style="font-size:13px;color:var(--hint);margin-top:4px">'+cur.rating+' · '+cur.category+' · 人均¥'+cur.per+' · '+(myPos&&cur.lat&&cur.lng?fmtD(havKm(myPos.lat,myPos.lng,cur.lat,cur.lng)):cur.dist)+' · 月售'+fmtS(cur.sales)+'</div></div></div>'+'<div style="padding:2px 16px 0">'+cur.tags.map(function(x){return '<span class="tagpill">'+x+'</span>'}).join('')+'</div>'+'<div class="t">信息</div><div class="group"><div class="cell"><div style="font-size:13px;color:var(--hint);line-height:1.7">📍 <a href="#" id="addrLink" style="color:var(--link);text-decoration:none">'+cur.address+'</a><br/>🕙 '+cur.hours+' · ☎ <a id="phoneLink" style="color:var(--link);text-decoration:none" href="tel:'+cur.phone+'">'+cur.phone+'</a><br/>🚇 '+cur.metro+'</div></div></div><div class="t">招牌 · 仅展示</div><div class="group">'+cur.signature.map(x=>'<div class="cell"><span>'+x.n+'</span><span style="margin-left:auto;color:var(--hint)">'+x.p+'</span></div>').join('')+'</div><div class="t">评价</div><div class="group"><div class="cell"><div style="font-size:13px;color:var(--hint);line-height:1.8">'+cur.reviews.map(x=>'“'+x.t+'” — '+x.u+' ⭐'+x.s).join('<br/>')+'</div></div></div>';try{document.getElementById('callBtn').href='tel:'+cur.phone;document.getElementById('addrLink').onclick=function(){document.getElementById('navBtn').click();return false;};tg?.BackButton?.show();}catch(e){}window.scrollTo(0,0);}catch(e){}}
function tgPlat(){var p='';try{p=tg.platform||'';}catch(e){}if(!p){try{p=/iPhone|iPad|iPod/.test(navigator.userAgent)?'ios':(/Android/.test(navigator.userAgent)?'android':'');}catch(e2){}}return p;}function mapUrl(k){var nm=encodeURIComponent(cur?.name||''),ad=encodeURIComponent(cur?.address||''),ct=encodeURIComponent(cur?.city||'');if(k==='amap'){return (cur&&cur.lat&&cur.lng)?'https://uri.amap.com/marker?position='+cur.lng+','+cur.lat+'&name='+nm+'&src=choutuan':'https://uri.amap.com/search?keyword='+nm+ad;}if(k==='qq'){return (cur&&cur.lat&&cur.lng)?'https://apis.map.qq.com/uri/v1/marker?marker=coord:'+cur.lat+','+cur.lng+';title:'+nm+';addr:'+ad+'&referer=choutuan':'https://apis.map.qq.com/uri/v1/search?keyword='+nm+'&region='+ct;}if(k==='bd'){return 'https://api.map.baidu.com/place/search?query='+nm+'&region='+ct+'&output=html&src=choutuan';}if(k==='apple'){return 'https://maps.apple.com/?q='+nm+'&ll='+((cur&&cur.lat)?cur.lat+', '+cur.lng:'');}return '';}function openMaps(){try{tg?.HapticFeedback?.selectionChanged();}catch(e){}var items=[['amap','高德地图'],['qq','腾讯地图'],['bd','百度地图']];if(tgPlat()==='ios'){items.push(['apple','苹果地图']);}items.push(['copy','复制地址']);var pl=tgPlat();if(pl==='android'){items.push(['sys','系统地图']);}var uid=null;try{uid=tg?.initDataUnsafe?.user?.id||null;}catch(e0){}if(uid){items.push(['venue','发到聊天']);}var box=document.getElementById('mapList');box.innerHTML='';items.forEach(function(it){var b=document.createElement('button');b.className='maprow';b.textContent=it[1];b.onclick=function(){goMap(it[0]);};box.appendChild(b);});document.getElementById('mapDim').onclick=closeMaps;document.getElementById('mapCancel').onclick=closeMaps;var pn0=document.querySelector('.mappanel');if(pn0){pn0.classList.remove('closing');}var dm0=document.getElementById('mapDim');if(dm0){dm0.style.opacity='';}document.getElementById('mapSheet').style.display='block';}function closeMaps(){try{tg?.HapticFeedback?.selectionChanged();}catch(e){}var pn=document.querySelector('.mappanel');if(pn){pn.classList.add('closing');}var dm=document.getElementById('mapDim');if(dm){dm.style.opacity='0';}setTimeout(function(){document.getElementById('mapSheet').style.display='none';if(pn){pn.classList.remove('closing');}if(dm){dm.style.opacity='';}},190);}function sysUrl(){if(!cur||!cur.lat||!cur.lng){return 'geo:0,0?q='+encodeURIComponent((cur?.name||'')+(cur?.address||''));}return 'geo:'+cur.lat+','+cur.lng+'?q='+encodeURIComponent(cur?.name||'');}async function sendVenue(){var uid=null;try{uid=tg?.initDataUnsafe?.user?.id||null;}catch(e){}if(!uid||!cur){return;}try{var r=await fetch('/api/venue',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({shop_id:cur.id,user_id:uid})}).then(function(x){return x.json();});if(r&&r.ok){try{tg?.HapticFeedback?.notificationOccurred('success');}catch(e2){}}}catch(e3){}}function goMap(k){closeMaps();try{tg?.HapticFeedback?.notificationOccurred('success');}catch(e){}if(k==='sys'){var u2=sysUrl();if(u2){try{tg?.openLink(u2);}catch(e9){location.href=u2;}}return;}if(k==='venue'){sendVenue();return;}if(k==='copy'){var t=(cur?.address||'');try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t);}else{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}}catch(e2){}return;}var u=mapUrl(k);if(!u){return;}try{tg?.openLink(u);}catch(e3){location.href=u;}}function goHome(){var dd=document.getElementById('detail');dd.classList.remove('anim');dd.classList.add('out');setTimeout(function(){dd.style.display='none';dd.classList.remove('out');document.getElementById('home').style.display='block';},180);try{tg?.BackButton?.hide();}catch(e){}}
document.getElementById('backBtn').onclick=goHome;
try{tg?.onEvent('backButtonClicked',goHome);}catch(e){}
document.getElementById('navBtn').onclick=()=>{try{tg?.HapticFeedback?.notificationOccurred('success');openMaps();}catch(e){}};
document.getElementById('shareBtn').onclick=()=>{try{tg?.HapticFeedback?.selectionChanged();const url='https://t.me/choutuan_bot';if(tg?.openTelegramLink)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(url)+'&text='+encodeURIComponent('推荐 '+cur?.name));else alert('分享占位');}catch(e){}};
document.getElementById('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(loadList,300);});
renderCities();try{var sc=localStorage.getItem('ct_city');if(sc){city=sc;cityManual=sc;renderCities();}}catch(e){}locate(function(){guessCity(function(){renderCities();loadCats().then(loadList);});});
</script>
</body>
</html>
